name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip || {
              echo "[RESULT_PUB_ERROR]"
              echo "❌ Gagal download ZIP."
              echo "[END_RESULT_PUB_ERROR]"
              exit 1
            }
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "⚠️ ZIP tidak valid, coba repair..."
            zip -FF project.zip --out project_fixed.zip > /dev/null 2>&1 || true
            if [ -f project_fixed.zip ] && unzip -t project_fixed.zip > /dev/null 2>&1; then
              mv project_fixed.zip project.zip
            fi
            if ! unzip -t project.zip > /dev/null 2>&1; then
              mkdir -p project_raw
              unzip -o -q project.zip -d project_raw || true
              if [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
                echo "[RESULT_PUB_ERROR]"
                echo "❌ ZIP tidak bisa di-extract."
                echo "[END_RESULT_PUB_ERROR]"
                exit 1
              fi
            fi
          fi

          if [ ! -d "project_raw" ] || [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
            unzip -q project.zip -d project_raw || true
          fi

          echo "=== Struktur project_raw ==="
          find project_raw -maxdepth 3 -type d | head -n 20

          PUB_PATH=$(find project_raw -maxdepth 4 -name "pubspec.yaml" 2>/dev/null | head -n 1)
          if [ -z "$PUB_PATH" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ pubspec.yaml tidak ditemukan sama sekali di ZIP."
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUB_PATH")
          echo "✅ pubspec.yaml ada di: $PUB_PATH"
          echo "✅ PROJECT_DIR: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -f project.zip project_fixed.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Detect Dart SDK
        id: detect_sdk
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f "pubspec.yaml" ]; then
            echo "flutter_version=3.32.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK_LINE=$(grep -A5 "^environment:" pubspec.yaml | grep "sdk:" | head -n 1)
          MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$MIN_DART" ]; then
            MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          fi
          if [ -z "$MIN_DART" ]; then
            MIN_DART="3.0.0"
          fi
          case "$MIN_DART" in
            2.*)          FLUTTER_VER="3.7.12" ;;
            3.0.*|3.1.*|3.2.*|3.3.*|3.4.*) FLUTTER_VER="3.19.6" ;;
            3.5.*)        FLUTTER_VER="3.24.5" ;;
            3.6.*|3.7.*)  FLUTTER_VER="3.29.3" ;;
            3.8.*)        FLUTTER_VER="3.32.0" ;;
            *)            FLUTTER_VER="3.35.0" ;;
          esac
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect_sdk.outputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          echo "📍 PWD: $(pwd)"
          rm -f pubspec.lock

          if timeout 300s flutter pub get > /tmp/pubget.log 2>&1; then
            echo "✅ pub get sukses"; cat /tmp/pubget.log; exit 0
          fi
          if timeout 300s flutter pub upgrade > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade sukses"; cat /tmp/pubget.log; exit 0
          fi
          if timeout 300s flutter pub upgrade --major-versions > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade --major-versions sukses"; cat /tmp/pubget.log; exit 0
          fi
          rm -f pubspec.lock
          if timeout 300s flutter pub get --offline > /tmp/pubget.log 2>&1; then
            echo "✅ pub get --offline sukses"; cat /tmp/pubget.log; exit 0
          fi
          echo "⚠️ pub get gagal, tetap lanjut."
          cat /tmp/pubget.log
          exit 0

      - name: Analyze Project Code
        run: |
          cd "$PROJECT_DIR"
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "✅ Analyze selesai."
          exit 0

      - name: Build APK (auto-tambal + deteksi error Dart)
        run: |
          cd "$PROJECT_DIR"
          echo "📍 PWD: $(pwd)"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          SUCCESS=0

          # PRE-BUILD: auto-strip assets yang hilang
          echo "════════ PRE-BUILD: sanitasi assets ════════"
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml pubspec.yaml.bak
            python3 - <<'PYEOF' 2>/dev/null || true
          import os
          try:
              with open("pubspec.yaml", "r") as f:
                  lines = f.read().split("
")
              out, in_assets = [], False
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith("assets:"):
                      in_assets = True
                      out.append(line)
                      continue
                  if in_assets:
                      if line and not line[0] in (" ", "	") and not stripped.startswith("-"):
                          in_assets = False
                          out.append(line)
                          continue
                      if stripped.startswith("-"):
                          p = stripped[1:].strip().strip('"').strip("'")
                          if p and not os.path.exists(p):
                              print(f"  ⚠️ Skip missing asset: {p}")
                              continue
                  out.append(line)
              with open("pubspec.yaml", "w") as f:
                  f.write("
".join(out))
              print("✅ Assets sanitized")
          except Exception as e:
              print(f"⚠️ Asset sanitize error: {e}")
          PYEOF
          fi

          # ATTEMPT 1
          echo "════════ ATTEMPT 1 ════════"
          flutter build apk --$BUILD_TYPE 2>&1 | tee /tmp/build1.log || true
          if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi

          # ATTEMPT 2
          if [ "$SUCCESS" -eq 0 ]; then
            echo "════════ ATTEMPT 2: clean + rebuild ════════"
            flutter clean || true
            flutter pub get || true
            flutter build apk --$BUILD_TYPE 2>&1 | tee /tmp/build2.log || true
            if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi
          fi

          # ATTEMPT 3
          if [ "$SUCCESS" -eq 0 ]; then
            echo "════════ ATTEMPT 3: --no-shrink ════════"
            flutter build apk --$BUILD_TYPE --no-shrink 2>&1 | tee /tmp/build3.log || true
            if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi
          fi

          # GAGAL TOTAL
          if [ "$SUCCESS" -eq 0 ]; then
            FINAL_LOG=/tmp/build3.log
            if [ ! -s "$FINAL_LOG" ]; then FINAL_LOG=/tmp/build2.log; fi
            if [ ! -s "$FINAL_LOG" ]; then FINAL_LOG=/tmp/build1.log; fi

            echo "[RESULT_PUB_ERROR]"
            echo "❌ Build GAGAL setelah 3x percobaan."
            echo ""
            echo "=== DART ERRORS ==="
            grep -nE '(\.dart:[0-9]+:[0-9]+:.*(Error|error)|Error:.*\.dart)' "$FINAL_LOG" 2>/dev/null | head -n 20 || echo "(tidak ada error Dart)"
            echo "=== END DART ERRORS ==="
            echo ""
            echo "=== GRADLE ERRORS ==="
            grep -iE "(FAILURE:|What went wrong|Execution failed|Could not)" "$FINAL_LOG" 2>/dev/null | head -n 10 || echo "(tidak ada error Gradle)"
            echo "=== END GRADLE ERRORS ==="
            echo ""
            echo "=== 40 BARIS TERAKHIR ==="
            tail -n 40 "$FINAL_LOG" 2>/dev/null || true
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi

          echo "✅ Build sukses, APK ada."

      - name: Find APK Output
        id: find_apk
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ APK tidak ditemukan."
            find $GITHUB_WORKSPACE -maxdepth 4 -type d | head -n 30
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_FOUND"
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 1
          if-no-files-found: error