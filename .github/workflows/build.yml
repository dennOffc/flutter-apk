name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          ls -lh project.zip
          unzip -q project.zip -d project_raw || {
            echo "❌ FILE ZIP RUSAK"
            exit 1
          }

      - name: Detect Project Dir
        run: |
          PUB=$(find project_raw -maxdepth 4 -name pubspec.yaml | head -n 1)
          if [ -z "$PUB" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUB")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ PROJECT_DIR: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.35.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get || echo "⚠️ pub get error, lanjut..."
          else
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi

      - name: Fix Missing Assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 0; fi
          IN_ASSETS=0
          while IFS= read -r line; do
            if echo "$line" | grep -qE "^\s*assets:\s*$"; then
              IN_ASSETS=1
              continue
            fi
            if [ "$IN_ASSETS" -eq 1 ]; then
              if echo "$line" | grep -qE "^\s{0,2}[a-z_]+:" && ! echo "$line" | grep -qE "^\s*-"; then
                IN_ASSETS=0
                continue
              fi
            fi
            if [ "$IN_ASSETS" -eq 1 ]; then
              ASSET_PATH=$(echo "$line" | sed -E 's/^\s*-\s*//' | tr -d '"' | tr -d "'")
              if [ -z "$ASSET_PATH" ]; then continue; fi
              if echo "$ASSET_PATH" | grep -qE "/$"; then
                mkdir -p "$ASSET_PATH"
              else
                if [ ! -f "$ASSET_PATH" ]; then
                  mkdir -p "$(dirname "$ASSET_PATH")"
                  if echo "$ASSET_PATH" | grep -qE "\.mp4$"; then
                    printf '\x00\x00\x00\x20ftypisom' > "$ASSET_PATH"
                  elif echo "$ASSET_PATH" | grep -qE "\.(png|jpg|jpeg|webp)$"; then
                    printf '\x89PNG\r\n\x1a\n' > "$ASSET_PATH"
                  else
                    touch "$ASSET_PATH"
                  fi
                fi
              fi
            fi
          done < pubspec.yaml
          echo "✅ Fix missing assets selesai"

      - name: Analyze Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== FLUTTER ANALYZE ==="
          flutter analyze > analyze.txt 2>&1 || true
          cat analyze.txt
          echo "✅ Analyze selesai (non-blocking)"

      - name: Build APK Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 1; fi
          flutter build apk --release \
            --split-per-abi \
            --shrink \
            --obfuscate \
            --split-debug-info=build/debug_info \
            --target-platform android-arm64,android-arm 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "[RESULT_DART_ERROR]"
            echo "❌ BUILD FAILED — ERROR DART"
            echo ""
            grep -nE '(^lib/.*\.dart|[a-zA-Z0-9_\-]+\.dart:[0-9]+:[0-9]+)' /tmp/build.log | head -n 30 || echo "(no match)"
            echo ""
            echo "════════ 40 BARIS TERAKHIR ════════"
            tail -n 40 /tmp/build.log
            echo "[END_RESULT_DART_ERROR]"
            exit 1
          fi
          echo "✅ Build sukses."

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 1; fi
          flutter build apk --debug \
            --split-per-abi \
            --shrink \
            --target-platform android-arm64,android-arm 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "[RESULT_DART_ERROR]"
            echo "❌ BUILD FAILED — ERROR DART"
            echo ""
            grep -nE '(^lib/.*\.dart|[a-zA-Z0-9_\-]+\.dart:[0-9]+:[0-9]+)' /tmp/build.log | head -n 30 || echo "(no match)"
            echo ""
            echo "════════ 40 BARIS TERAKHIR ════════"
            tail -n 40 /tmp/build.log
            echo "[END_RESULT_DART_ERROR]"
            exit 1
          fi
          echo "✅ Build sukses."

      - name: Organize APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/final-apk
          find build/app/outputs/flutter-apk -name "*.apk" -type f | while read apk; do
            ORIGINAL=$(basename "$apk")
            if echo "$ORIGINAL" | grep -q "arm64-v8a"; then
              cp "$apk" "build/final-apk/app-arm64-v8a.apk"
            elif echo "$ORIGINAL" | grep -q "armeabi-v7a"; then
              cp "$apk" "build/final-apk/app-armeabi-v7a.apk"
            else
              cp "$apk" "build/final-apk/app-$ORIGINAL"
            fi
          done
          ls -lh build/final-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/final-apk/*.apk
          retention-days: 1
          if-no-files-found: error
