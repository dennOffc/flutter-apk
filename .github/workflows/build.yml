name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download ZIP project
        run: |
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          ls -lh project.zip
          unzip -q project.zip -d project_raw || { echo "❌ ZIP RUSAK"; exit 1; }

      - name: Detect Project Dir
        run: |
          PUB=$(find project_raw -maxdepth 4 -name pubspec.yaml | head -n 1)
          if [ -z "$PUB" ]; then echo "❌ pubspec.yaml tidak ditemukan"; exit 1; fi
          PROJECT_DIR=$(dirname "$PUB")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ PROJECT_DIR: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.35.0"
          channel: "stable"
          cache: true

      - name: Fix Gradle Files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "════════ FORCE-FIX GRADLE FILES ════════"

          if [ -f "android/app/build.gradle.kts" ]; then
            if grep -q "minSdkVersion flutter.minSdkVersion" android/app/build.gradle.kts; then
              echo "⚠️ build.gradle.kts versi lama, replace total..."
              cat > android/app/build.gradle.kts << 'KTS_EOF'
plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
}

android {
    namespace = "com.example.app"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.example.app"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
        }
    }
}

flutter {
    source = "../.."
}
KTS_EOF
              echo "✅ build.gradle.kts di-replace total"
            else
              echo "✅ build.gradle.kts OK"
            fi
            sed -n '20,30p' android/app/build.gradle.kts
          fi

          if [ -f "android/build.gradle.kts" ]; then
            if ! grep -q "newBuildDir" android/build.gradle.kts; then
              cat > android/build.gradle.kts << 'KTS_EOF'
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register<Delete>("clean") {
    delete(rootProject.layout.buildDirectory)
}
KTS_EOF
              echo "✅ android/build.gradle.kts di-replace"
            else
              echo "✅ android/build.gradle.kts OK"
            fi
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            if ! grep -q "flutter-plugin-loader" android/settings.gradle.kts; then
              cat > android/settings.gradle.kts << 'KTS_EOF'
pluginManagement {
    val flutterSdkPath = run {
        val properties = java.util.Properties()
        file("local.properties").inputStream().use { properties.load(it) }
        val flutterSdkPath = properties.getProperty("flutter.sdk")
        require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
        flutterSdkPath
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.android.application") version "8.7.3" apply false
    id("org.jetbrains.kotlin.android") version "2.1.0" apply false
}

include(":app")
KTS_EOF
              echo "✅ android/settings.gradle.kts di-replace"
            else
              echo "✅ android/settings.gradle.kts OK"
            fi
          fi

          if [ -f "android/gradle.properties" ]; then
            grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
            echo "✅ gradle.properties OK"
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER_EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
WRAPPER_EOF
            echo "✅ gradle-wrapper.properties → Gradle 8.7"
          fi

          echo "════════ SELESAI FORCE-FIX GRADLE ════════"

      - name: Auto-Fix Pubspec + Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then echo "❌ pubspec.yaml tidak ada"; exit 1; fi
          cp pubspec.yaml pubspec.yaml.bak
          sed -i -E 's|^(\s*sdk\s*:).*$|\1 ">=3.0.0 <4.0.0"|' pubspec.yaml

          awk '
            /^[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]*:/ {
              key = $1
              sub(/:.*/, "", key)
              if (seen[key]++) next
            }
            { print }
          ' pubspec.yaml > pubspec.tmp && mv pubspec.tmp pubspec.yaml

          awk '
            BEGIN { in_assets = 0 }
            /^[[:space:]]*assets[[:space:]]*:/ { in_assets = 1; print; next }
            {
              if (in_assets) {
                if ($0 !~ /^[[:space:]]/ && $0 !~ /^[[:space:]]*-/) { in_assets = 0; print; next }
                if ($0 ~ /^[[:space:]]*-/) {
                  p = $0
                  sub(/^[[:space:]]*-[[:space:]]*/, "", p)
                  gsub(/["\x27]/, "", p)
                  cmd = "test -e \"" p "\""
                  if (system(cmd) != 0) {
                    cmd2 = "mkdir -p \"\$(dirname \"" p "\")\" && touch \"" p "\""
                    system(cmd2)
                  }
                }
              }
              print
            }
          ' pubspec.yaml > pubspec.tmp && mv pubspec.tmp pubspec.yaml

          awk '
            BEGIN { in_fonts = 0 }
            /^[[:space:]]*fonts[[:space:]]*:/ { in_fonts = 1; print; next }
            {
              if (in_fonts) {
                if ($0 !~ /^[[:space:]]/ && $0 !~ /^[[:space:]]*-/) { in_fonts = 0; print; next }
                if ($0 ~ /asset:/) {
                  p = $0
                  sub(/.*asset:[[:space:]]*/, "", p)
                  gsub(/["\x27]/, "", p)
                  cmd = "test -e \"" p "\""
                  if (system(cmd) != 0) {
                    cmd2 = "mkdir -p \"\$(dirname \"" p "\")\" && touch \"" p "\""
                    system(cmd2)
                  }
                }
              }
              print
            }
          ' pubspec.yaml > pubspec.tmp && mv pubspec.tmp pubspec.yaml

          echo "✅ pubspec.yaml di-sanitize"
          head -n 15 pubspec.yaml

          rm -f pubspec.lock
          if flutter pub get > /tmp/pub.log 2>&1; then
            echo "✅ pub get sukses"; exit 0
          fi
          cat /tmp/pub.log

          if flutter pub upgrade > /tmp/pub.log 2>&1; then
            echo "✅ pub upgrade sukses"; exit 0
          fi
          cat /tmp/pub.log

          if flutter pub upgrade --major-versions > /tmp/pub.log 2>&1; then
            echo "✅ pub upgrade --major-versions sukses"; exit 0
          fi
          cat /tmp/pub.log

          sed -i -E 's|^([[:space:]]{2,}[a-zA-Z0-9_]+:[[:space:]]*)(\^|>=)?[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+.*$|\1any|' pubspec.yaml
          if flutter pub get > /tmp/pub.log 2>&1; then
            echo "✅ pub get dengan 'any' sukses"; exit 0
          fi
          cat /tmp/pub.log
          echo "⚠️ Semua strategi pub get gagal, tetap lanjut"
          exit 0

      - name: Analyze Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze > analyze.txt 2>&1 || true
          cat analyze.txt
          echo "✅ Analyze selesai (non-blocking)"

      - name: Build APK Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 1; fi
          flutter build apk --release --split-per-abi --shrink --obfuscate --split-debug-info=build/debug_info --target-platform android-arm64,android-arm 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "[RESULT_DART_ERROR]"
            echo "❌ BUILD FAILED"
            grep -nE '([a-zA-Z0-9_\-]+\.(dart|gradle|gradle\.kts|kt|java|xml|yaml|yml):[0-9]+)' /tmp/build.log | head -n 30 || echo "(no file match)"
            echo "════════ 40 BARIS TERAKHIR ════════"
            tail -n 40 /tmp/build.log
            echo "[END_RESULT_DART_ERROR]"
            exit 1
          fi
          echo "✅ Build sukses."

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 1; fi
          flutter build apk --debug --split-per-abi --shrink --target-platform android-arm64,android-arm 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "[RESULT_DART_ERROR]"
            echo "❌ BUILD FAILED"
            grep -nE '([a-zA-Z0-9_\-]+\.(dart|gradle|gradle\.kts|kt|java|xml|yaml|yml):[0-9]+)' /tmp/build.log | head -n 30 || echo "(no file match)"
            echo "════════ 40 BARIS TERAKHIR ════════"
            tail -n 40 /tmp/build.log
            echo "[END_RESULT_DART_ERROR]"
            exit 1
          fi
          echo "✅ Build sukses."

      - name: Organize APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/final-apk
          find build/app/outputs/flutter-apk -name "*.apk" -type f | while read apk; do
            ORIGINAL=$(basename "$apk")
            if echo "$ORIGINAL" | grep -q "arm64-v8a"; then cp "$apk" "build/final-apk/app-arm64-v8a.apk"
            elif echo "$ORIGINAL" | grep -q "armeabi-v7a"; then cp "$apk" "build/final-apk/app-armeabi-v7a.apk"
            else cp "$apk" "build/final-apk/app-$ORIGINAL"; fi
          done
          ls -lh build/final-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/final-apk/*.apk
          retention-days: 1
          if-no-files-found: error