name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          ls -lh project.zip
          unzip -q project.zip -d project_raw

      - name: Detect Project Dir
        run: |
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.35.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          fi

      - name: Analyze Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== FLUTTER ANALYZE ==="
          flutter analyze > analyze.txt 2>&1 || true
          cat analyze.txt
          
          ERROR_COUNT=$(grep -c "error" analyze.txt || true)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo ""
            echo "============================================"
            echo "❌ KODE DART PROJECT KAMU ADA ERROR!"
            echo "============================================"
            echo ""
            grep "error" analyze.txt | head -30
            echo ""
            echo "============================================"
            echo "⚠️ PERBAIKI ERROR DI ATAS DULU!"
            echo "============================================"
            exit 1
          fi
          
          echo ""
          echo "✅ Kode Dart bersih, lanjut build..."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --${{ github.event.inputs.build_type }}
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: "**/*.apk"
          retention-days: 1
          if-no-files-found: error
