name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip || {
              echo "[RESULT_PUB_ERROR]"
              echo "❌ Gagal download ZIP dari URL."
              echo "[END_RESULT_PUB_ERROR]"
              exit 1
            }
          ls -lh project.zip

      - name: Extract ZIP (auto-fix kalau bukan zip / corrupt)
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "⚠️ File bukan ZIP valid, coba repair..."
            # Coba repair pakai zip -FF kalau ada
            if command -v zip >/dev/null 2>&1; then
              zip -FF project.zip --out project_fixed.zip > /dev/null 2>&1 || true
              if [ -f project_fixed.zip ] && unzip -t project_fixed.zip > /dev/null 2>&1; then
                mv project_fixed.zip project.zip
                echo "✅ ZIP berhasil diperbaiki."
              fi
            fi
            # Kalau masih gagal, tetap coba extract paksa
            if ! unzip -t project.zip > /dev/null 2>&1; then
              echo "⚠️ Tetap gagal, coba extract paksa (mungkin partial)..."
              mkdir -p project_raw
              unzip -o -q project.zip -d project_raw || true
              if [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
                echo "[RESULT_PUB_ERROR]"
                echo "❌ File benar-benar bukan ZIP valid dan tidak bisa di-extract."
                echo "[END_RESULT_PUB_ERROR]"
                exit 1
              fi
              echo "⚠️ Extract partial berhasil, lanjut..."
            fi
          fi

          # Kalau belum di-extract (kondisi normal)
          if [ ! -d "project_raw" ] || [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
            unzip -q project.zip -d project_raw || true
          fi

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -f project.zip project_fixed.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Detect Dart SDK Requirement
        id: detect_sdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "flutter_version=3.32.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK_LINE=$(grep -A5 "^environment:" pubspec.yaml | grep "sdk:" | head -n 1)
          MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$MIN_DART" ]; then
            MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          fi
          if [ -z "$MIN_DART" ]; then
            MIN_DART="3.0.0"
          fi
          case "$MIN_DART" in
            2.*)          FLUTTER_VER="3.7.12" ;;
            3.0.*|3.1.*|3.2.*|3.3.*|3.4.*) FLUTTER_VER="3.19.6" ;;
            3.5.*)        FLUTTER_VER="3.24.5" ;;
            3.6.*|3.7.*)  FLUTTER_VER="3.29.3" ;;
            3.8.*)        FLUTTER_VER="3.32.0" ;;
            *)            FLUTTER_VER="3.35.0" ;;
          esac
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect_sdk.outputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: Get dependencies (auto-tambal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "⚠️ pubspec.yaml tidak ada, coba cari di subfolder..."
            FOUND_PUB=$(find . -name "pubspec.yaml" | head -n 1)
            if [ -n "$FOUND_PUB" ]; then
              NEW_DIR=$(dirname "$FOUND_PUB")
              echo "PROJECT_DIR=$NEW_DIR" >> $GITHUB_ENV
              cd "$NEW_DIR"
            else
              echo "[RESULT_PUB_ERROR]"
              echo "❌ pubspec.yaml tidak ditemukan di project!"
              echo "[END_RESULT_PUB_ERROR]"
              exit 1
            fi
          fi

          echo "=== Hapus pubspec.lock lama ==="
          rm -f pubspec.lock

          # Coba beberapa strategi, semuanya toleran error
          echo "=== Coba flutter pub get ==="
          if timeout 300s flutter pub get > /tmp/pubget.log 2>&1; then
            echo "✅ pub get sukses"
            cat /tmp/pubget.log
            exit 0
          fi

          echo "=== pub get gagal, coba pub upgrade ==="
          if timeout 300s flutter pub upgrade > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade sukses"
            cat /tmp/pubget.log
            exit 0
          fi

          echo "=== coba pub upgrade --major-versions ==="
          if timeout 300s flutter pub upgrade --major-versions > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade --major-versions sukses"
            cat /tmp/pubget.log
            exit 0
          fi

          echo "=== Tambal: hapus dependency bermasalah & coba lagi ==="
          # Fallback: hapus pubspec.lock, coba get ulang
          rm -f pubspec.lock
          if timeout 300s flutter pub get --offline > /tmp/pubget.log 2>&1; then
            echo "✅ pub get --offline sukses"
            cat /tmp/pubget.log
            exit 0
          fi

          echo "⚠️ Semua cara gagal, tapi tetap lanjut (mungkin pub get error non-fatal)."
          cat /tmp/pubget.log
          exit 0

      - name: Analyze Project Code (non-fatal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "✅ Analyze selesai. Build di-skip karena only_analyze=true."
          exit 0

      - name: Build APK (auto-tambal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e  # jangan langsung stop kalau ada error
          if [ -f "pubspec.yaml" ]; then
            echo "=== Build Flutter APK ==="
            flutter build apk --${{ github.event.inputs.build_type }} 2>&1 | tee /tmp/build.log
            BUILD_STATUS=${PIPESTATUS[0]}

            if [ "$BUILD_STATUS" -ne 0 ]; then
              echo "⚠️ Build gagal, coba tambal..."

              # Tambal 1: bersihkan & get ulang
              flutter clean
              flutter pub get || true

              # Tambal 2: coba build ulang
              flutter build apk --${{ github.event.inputs.build_type }} 2>&1 | tee /tmp/build2.log
              BUILD_STATUS=${PIPESTATUS[0]}
            fi

            if [ "$BUILD_STATUS" -ne 0 ]; then
              echo "⚠️ Masih gagal, coba build tanpa shrink..."
              flutter build apk --${{ github.event.inputs.build_type }} --no-shrink 2>&1 | tee /tmp/build3.log
              BUILD_STATUS=${PIPESTATUS[0]}
            fi
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              cd "$GRADLE_DIR" && chmod +x gradlew
              if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
                ./gradlew assembleDebug || true
              else
                ./gradlew assembleRelease || true
              fi
            fi
          fi
          exit 0

      - name: Find APK Output (anti-gagal)
        id: find_apk
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ APK tidak ditemukan setelah build."
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_OUTPUT
          echo "✅ APK ditemukan: $APK_FOUND"

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
