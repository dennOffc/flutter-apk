name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
      tag:
        required: true
      build_type:
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download
        run: |
          curl -sL -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          ls -lh project.zip

      - name: Extract
        run: |
          unzip -q project.zip -d src
          PUB=$(find src -maxdepth 5 -name pubspec.yaml | head -n 1)
          if [ -z "$PUB" ]; then echo "❌ pubspec.yaml tidak ada"; exit 1; fi
          DIR=$(dirname "$PUB")
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Clean pubspec
        run: |
          cd "$DIR"
          # Hapus duplicate keys pakai awk
          awk '!/^[a-zA-Z_][a-zA-Z0-9_]*:/{print;next} {key=$1;sub(/:.*/,"",key); if(seen[key]++)next; print}' pubspec.yaml > p.tmp && mv p.tmp pubspec.yaml || true
          # Hapus asset yang filenya gak ada
          awk '
            BEGIN{in_a=0}
            /^[[:space:]]*assets[[:space:]]*:/{in_a=1;print;next}
            {
              if(in_a){
                if($0!~/^[[:space:]]/&&$0!~/^[[:space:]]*-/){in_a=0;print;next}
                if($0~/^[[:space:]]*-/){
                  p=$0;sub(/^[[:space:]]*-[[:space:]]*/,"",p);gsub(/["\x27]/,"",p);
                  if(system("test -e \""p"\"")!=0)next
                }
              }
              print
            }
          ' pubspec.yaml > p.tmp && mv p.tmp pubspec.yaml || true

      - name: Dependencies
        run: |
          cd "$DIR"
          rm -f pubspec.lock
          flutter pub get || flutter pub upgrade || true

      - name: Build APK
        run: |
          cd "$DIR"
          flutter build apk --${{ github.event.inputs.build_type }} || \
          (flutter clean && flutter pub get && flutter build apk --${{ github.event.inputs.build_type }}) || true

      - name: Find APK
        id: find
        run: |
          APK=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "❌ APK tidak ada"; exit 1; fi
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: ${{ steps.find.outputs.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
