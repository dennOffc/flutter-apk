name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip || {
              echo "[RESULT_PUB_ERROR]"
              echo "❌ Gagal download ZIP dari URL."
              echo "[END_RESULT_PUB_ERROR]"
              exit 1
            }
          ls -lh project.zip

      - name: Extract ZIP (auto-fix + auto-detect project dir)
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "⚠️ File bukan ZIP valid, coba repair..."
            if command -v zip >/dev/null 2>&1; then
              zip -FF project.zip --out project_fixed.zip > /dev/null 2>&1 || true
              if [ -f project_fixed.zip ] && unzip -t project_fixed.zip > /dev/null 2>&1; then
                mv project_fixed.zip project.zip
                echo "✅ ZIP berhasil diperbaiki."
              fi
            fi
            if ! unzip -t project.zip > /dev/null 2>&1; then
              echo "⚠️ Tetap gagal, coba extract paksa (mungkin partial)..."
              mkdir -p project_raw
              unzip -o -q project.zip -d project_raw || true
              if [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
                echo "[RESULT_PUB_ERROR]"
                echo "❌ File benar-benar bukan ZIP valid dan tidak bisa di-extract."
                echo "[END_RESULT_PUB_ERROR]"
                exit 1
              fi
              echo "⚠️ Extract partial berhasil, lanjut..."
            fi
          fi

          if [ ! -d "project_raw" ] || [ -z "$(ls -A project_raw 2>/dev/null)" ]; then
            unzip -q project.zip -d project_raw || true
          fi

          echo "=== Struktur awal project_raw ==="
          find project_raw -maxdepth 2 -type d | head -n 20
          echo "=== File di root project_raw ==="
          find project_raw -maxdepth 1 -type f | head -n 20

          PUB_PATH=$(find project_raw -maxdepth 4 -name "pubspec.yaml" 2>/dev/null | head -n 1)
          if [ -n "$PUB_PATH" ]; then
            PROJECT_DIR=$(dirname "$PUB_PATH")
            echo "✅ pubspec.yaml ditemukan di: $PUB_PATH"
            echo "✅ PROJECT_DIR di-set ke: $PROJECT_DIR"
          else
            SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
            FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
            if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
              PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
            else
              PROJECT_DIR="project_raw"
            fi
            echo "⚠️ pubspec.yaml tidak ketemu, fallback PROJECT_DIR=$PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -f project.zip project_fixed.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Detect Dart SDK Requirement
        id: detect_sdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "flutter_version=3.32.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          SDK_LINE=$(grep -A5 "^environment:" pubspec.yaml | grep "sdk:" | head -n 1)
          MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$MIN_DART" ]; then
            MIN_DART=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          fi
          if [ -z "$MIN_DART" ]; then
            MIN_DART="3.0.0"
          fi
          case "$MIN_DART" in
            2.*)          FLUTTER_VER="3.7.12" ;;
            3.0.*|3.1.*|3.2.*|3.3.*|3.4.*) FLUTTER_VER="3.19.6" ;;
            3.5.*)        FLUTTER_VER="3.24.5" ;;
            3.6.*|3.7.*)  FLUTTER_VER="3.29.3" ;;
            3.8.*)        FLUTTER_VER="3.32.0" ;;
            *)            FLUTTER_VER="3.35.0" ;;
          esac
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect_sdk.outputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: Get dependencies (auto-tambal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          PUB_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUB_PATH" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ pubspec.yaml TIDAK DITEMUKAN."
            ls -la
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          PROJECT_REAL_DIR=$(dirname "$PUB_PATH")
          echo "PROJECT_DIR=$PROJECT_REAL_DIR" >> $GITHUB_ENV
          cd "$PROJECT_REAL_DIR"

          rm -f pubspec.lock
          if timeout 300s flutter pub get > /tmp/pubget.log 2>&1; then
            echo "✅ pub get sukses"; cat /tmp/pubget.log; exit 0
          fi
          if timeout 300s flutter pub upgrade > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade sukses"; cat /tmp/pubget.log; exit 0
          fi
          if timeout 300s flutter pub upgrade --major-versions > /tmp/pubget.log 2>&1; then
            echo "✅ pub upgrade --major-versions sukses"; cat /tmp/pubget.log; exit 0
          fi
          rm -f pubspec.lock
          if timeout 300s flutter pub get --offline > /tmp/pubget.log 2>&1; then
            echo "✅ pub get --offline sukses"; cat /tmp/pubget.log; exit 0
          fi
          echo "⚠️ pub get gagal, tetap lanjut."; cat /tmp/pubget.log
          exit 0

      - name: Analyze Project Code (non-fatal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "✅ Analyze selesai."
          exit 0

      - name: Build APK (WAJIB SUKSES)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ ! -f "pubspec.yaml" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ pubspec.yaml tidak ada di ${{ env.PROJECT_DIR }}"
            ls -la
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi

          SUCCESS=0
          echo "════════ ATTEMPT 1 ════════"
          flutter build apk --$BUILD_TYPE 2>&1 | tee /tmp/build1.log
          if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "════════ ATTEMPT 2 ════════"
            flutter clean || true
            flutter pub get || true
            flutter build apk --$BUILD_TYPE 2>&1 | tee /tmp/build2.log
            if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "════════ ATTEMPT 3 ════════"
            flutter build apk --$BUILD_TYPE --no-shrink 2>&1 | tee /tmp/build3.log
            if [ -n "$(find . -name '*.apk' 2>/dev/null | head -n 1)" ]; then SUCCESS=1; fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ Build GAGAL TOTAL."
            echo "--- 40 baris log 3 ---"
            tail -n 40 /tmp/build3.log 2>/dev/null || true
            echo "--- 40 baris log 2 ---"
            tail -n 40 /tmp/build2.log 2>/dev/null || true
            echo "--- 40 baris log 1 ---"
            tail -n 40 /tmp/build1.log 2>/dev/null || true
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          echo "✅ Build sukses, APK ada."

      - name: Find APK Output (validasi)
        id: find_apk
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "[RESULT_PUB_ERROR]"
            echo "❌ APK tidak ditemukan."
            find $GITHUB_WORKSPACE -maxdepth 4 -type d | head -n 30
            echo "[END_RESULT_PUB_ERROR]"
            exit 1
          fi
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_FOUND"
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 1
          if-no-files-found: error