name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
      tag:
        required: true
      build_type:
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download
        run: |
          curl -L --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip

      - name: Extract
        run: |
          unzip -q project.zip -d project_raw || true
          PUB=$(find project_raw -maxdepth 4 -name "pubspec.yaml" | head -n 1)
          echo "PROJECT_DIR=$(dirname $PUB)" >> $GITHUB_ENV

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          cd "$PROJECT_DIR"
          rm -f pubspec.lock
          flutter pub get || flutter pub upgrade || true

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --${{ github.event.inputs.build_type }} || \
          (flutter clean && flutter pub get && flutter build apk --${{ github.event.inputs.build_type }})

      - name: Locate APK
        id: find
        run: |
          APK=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: ${{ steps.find.outputs.APK_PATH }}
